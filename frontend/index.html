
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="#">Expense Tracker</a>
    </div>
  </nav>

  <main class="container py-4">

    <h1 class="mb-4">Dashboard</h1>

    <!-- Summary Cards -->
    <div class="row g-3 mb-4">

      <div class="col-md-4">
        <div class="card shadow-sm h-100">
          <div class="card-body">
            <h5 class="card-title">Total Expenses</h5>
            <p id="totalAmount" class="fs-3 fw-bold mb-0">$0.00</p>
          </div>
        </div>
      </div>

      <div class="col-md-4">
        <div class="card shadow-sm h-100">
          <div class="card-body">
            <h5 class="card-title">Number of Expenses</h5>
            <p id="expenseCount" class="fs-3 fw-bold mb-0">0</p>
          </div>
        </div>
      </div>

      <div class="col-md-4">
        <div class="card shadow-sm h-100">
          <div class="card-body">
            <h5 class="card-title">Highest Expense</h5>
            <p id="highestExpense" class="fs-3 fw-bold mb-0">$0.00</p>
          </div>
        </div>
      </div>

    </div>

    <!-- Alert -->
    <div id="alertContainer"></div>

    <!-- Expense Form -->
    <section class="card shadow-sm mb-4">
      <div class="card-header">
        <h2 class="h5 mb-0" id="formTitle">Add Expense</h2>
      </div>

      <div class="card-body">

        <form id="expenseForm">
          <input type="hidden" id="expenseId">

          <div class="row g-3">

            <div class="col-md-6">
              <label for="title" class="form-label">Title</label>
              <input
                type="text"
                class="form-control"
                id="title"
                maxlength="100"
                required
              >
            </div>

            <div class="col-md-6">
              <label for="amount" class="form-label">Amount</label>
              <input
                type="number"
                class="form-control"
                id="amount"
                min="0.01"
                step="0.01"
                required
              >
            </div>

            <div class="col-md-6">
              <label for="category" class="form-label">Category</label>
              <select id="category" class="form-select" required>
                <option value="">Select category</option>
                <option value="Food">Food</option>
                <option value="Transport">Transport</option>
                <option value="Bills">Bills</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Other">Other</option>
              </select>
            </div>

            <div class="col-md-6">
              <label for="date" class="form-label">Date</label>
              <input
                type="date"
                class="form-control"
                id="date"
                required
              >
            </div>

          </div>

          <div class="mt-3">
            <button type="submit" class="btn btn-primary" id="submitBtn">
              Add Expense
            </button>

            <button
              type="button"
              class="btn btn-secondary d-none"
              id="cancelEditBtn"
            >
              Cancel Edit
            </button>
          </div>

        </form>

      </div>
    </section>

    <!-- Expenses Table -->
    <section class="card shadow-sm">
      <div class="card-header">
        <div class="row align-items-center g-2">
          <div class="col-md">
            <h2 class="h5 mb-0">Expenses</h2>
          </div>

          <div class="col-md-4">
            <label for="categoryFilter" class="visually-hidden">
              Filter by category
            </label>

            <select id="categoryFilter" class="form-select">
              <option value="All">All Categories</option>
              <option value="Food">Food</option>
              <option value="Transport">Transport</option>
              <option value="Bills">Bills</option>
              <option value="Entertainment">Entertainment</option>
              <option value="Other">Other</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Loading Spinner -->
      <div id="loadingSpinner" class="text-center py-4 d-none">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>
      </div>

      <div class="table-responsive">
        <table class="table table-striped table-hover mb-0">
          <thead class="table-dark">
            <tr>
              <th>Title</th>
              <th>Amount</th>
              <th>Category</th>
              <th>Date</th>
              <th>Actions</th>
            </tr>
          </thead>

          <tbody id="expensesTableBody">
            <!-- JavaScript will insert rows here -->
          </tbody>
        </table>
      </div>
    </section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
